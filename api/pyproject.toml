[project]
name = "preflight-api"
version = "0.1.0"
description = "Preflight control plane: admits, limits and bills visitors; proxies the guide."
requires-python = ">=3.11,<3.12"
dependencies = [
	"fastapi>=0.115",
	"pydantic>=2.8",
	"httpx>=0.27",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preflight_api"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["W191", "E101", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
