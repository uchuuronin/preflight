[project]
name = "preflight-api"
version = "0.1.0"
description = "Preflight control plane: admits, limits and bills visitors; proxies the guide."
requires-python = ">=3.11,<3.12"
dependencies = [
	# The shared schema, load_record() and A's job queue come from the root package.
	"preflight",
	"fastapi>=0.115",
	"pydantic>=2.8",
	"httpx>=0.27",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30"]

[tool.uv.sources]
preflight = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preflight_api"]

# Same settings as the root project, so `ruff check .` from the root agrees with this one.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["W191", "E501", "RUF001", "RUF002", "RUF003", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
