# Runs on every push to an agent branch and every PR into main.
# Owned by A until handover; C owns it after the Tue Oct 27 handover.
# Third-party actions are pinned to commit SHAs (tag in the comment).
name: ci

on:
  push:
    branches: [main, ws-a, ws-b, ws-c, ws-d]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Generated schema and TS types are current
        run: uv run python -m preflight.schema.generate --check
      - name: Tests (no torch)
        run: uv run pytest -m "not torch and not gpu and not network" -q
      - name: TS encoding parity
        run: node --test schema/ts/*.test.ts
      - name: Web GPU table matches engine/gpus.py
        run: uv run python web/scripts/make_gpu_table.py --check
      - name: Web price table matches engine/prices
        run: uv run python web/scripts/make_price_table.py --check
      - name: No GPL, AGPL or SSPL dependencies (gap 22)
        run: uv run python .github/scripts/licences.py

  api:
    # The FastAPI control plane (api/), its own uv project on top of the preflight package.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true
      - working-directory: api
        run: |
          uv sync --locked
          uv run pytest -q
          uv run python ../.github/scripts/licences.py

  verify-action:
    # The Action users add to their CI, run on its example records: a passing fix must pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: v
        uses: ./.github/actions/verify
        with:
          before: .github/actions/verify/examples/before.json
          after: .github/actions/verify/examples/after.json
      - run: test "${{ steps.v.outputs.status }}" = passed

  torch:
    # Probes and the recorder on CPU torch: no GPU in CI, but the code paths are the same.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      # accelerate: the HF Trainer refuses to start without it
      - run: uv pip install "torch>=2.4" psutil transformers accelerate --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # --no-sync keeps uv from reconciling the env with the lockfile, which has no torch in it
      - run: uv run --no-sync pytest -m "torch and not gpu and not network" -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: has
        run: test -f web/package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.web == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - if: steps.has.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck --if-present
          npm test --if-present
          node scripts/licences.mjs
          npm run build
      - if: steps.has.outputs.web == 'true'
        name: Stranger test on the built app (e2e/stranger.mjs)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run stranger

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The gitleaks binary itself, pinned and checksum-verified, rather than the wrapper action:
      # no licence or token handling, and a failure prints the findings.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      # Only the history of the commit under test: by default gitleaks reads every fetched ref, so
      # one branch's false alarm turned every branch red. Each branch is scanned by its own CI and
      # again when it merges into main.
      - name: Scan this branch's history
        run: ./gitleaks git . --log-opts=HEAD --redact --no-banner --verbose --exit-code 1
