# Run a command that needs the cloud (Modal GPUs, Muse Spark on Baseten, the Meta Model API) from
# any branch, without the agent ever holding a key. Agents' sandboxes can't reach these services;
# GitHub's runners can. Results land on the `remote-runs` branch as runs/<name>/ (log.txt, out/,
# result.json). Owned by the PM chat; see docs/setup/cloud.md.
name: remote-run

on:
  workflow_dispatch:
    inputs:
      name:
        description: Short label for the run (letters, digits, dashes)
        required: true
      cmd:
        description: Command, starting with `modal run `, `modal deploy ` or `python ` (scripts/ or -m preflight.)
        required: true
      ref:
        description: Branch or commit to run
        default: main
      timeout:
        description: Minutes before the job is stopped (max 120)
        default: "30"

permissions:
  contents: write

concurrency:
  group: remote-run-${{ github.event.inputs.name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      RUN_NAME: ${{ github.event.inputs.name }}
      RUN_CMD: ${{ github.event.inputs.cmd }}
      RUN_REF: ${{ github.event.inputs.ref }}
      RUN_TIMEOUT: ${{ github.event.inputs.timeout }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Check the inputs
        run: |
          set -euo pipefail
          [[ "$RUN_NAME" =~ ^[A-Za-z0-9-]{1,48}$ ]] || { echo "name: letters, digits and dashes, up to 48"; exit 2; }
          [[ "$RUN_TIMEOUT" =~ ^[0-9]{1,3}$ && "$RUN_TIMEOUT" -ge 1 && "$RUN_TIMEOUT" -le 120 ]] || { echo "timeout: 1 to 120 minutes"; exit 2; }
          # one command, no shell chaining; only our own entry points
          [[ "$RUN_CMD" =~ ^(modal\ (run|deploy)\ |python\ (scripts/|-m\ preflight\.))[A-Za-z0-9_./:=,@\ -]*$ ]] || { echo "cmd must start with 'modal run ', 'modal deploy ' or 'python scripts/' or 'python -m preflight.' and contain no shell operators"; exit 2; }
          echo "RUN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUN_DIR=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}-${RUN_NAME}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.x"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra modal
      - name: Run
        id: run
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_API_BASE: ${{ secrets.META_API_BASE }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
        run: |
          set +e
          mkdir -p out
          read -r -a argv <<< "$RUN_CMD"
          # Run the command directly (no uv layer between it and the signal). At the limit send
          # SIGINT, which `modal run` handles by stopping its app; SIGKILL follows 2 minutes later.
          # A plain SIGTERM killed the client and left its GPU functions running (A, Oct 28).
          source .venv/bin/activate
          # unbuffered, so a run that is cut off still leaves its last lines in the log
          export PYTHONUNBUFFERED=1
          timeout -s INT -k 2m "${RUN_TIMEOUT}m" "${argv[@]}" > run.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -n 50 run.log
          exit 0
      - name: Stop this run's Modal apps if it was cut off
        # 124 timed out after SIGINT, 137 needed SIGKILL, 130 interrupted. Only app ids printed in
        # this run's own log are stopped, so other agents' runs are never touched.
        if: always() && (steps.run.outputs.exit == '124' || steps.run.outputs.exit == '137' || steps.run.outputs.exit == '130')
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set +e
          source .venv/bin/activate
          grep -oE 'modal\.com/apps/[^/ ]+/[^/ ]+/ap-[A-Za-z0-9]+' run.log | sort -u | while IFS=/ read -r _ _ _ env app; do
            echo "stopping $app in $env"
            modal app stop "$app" --env "$env" --yes >> run.log 2>&1 || echo "could not stop $app" >> run.log
          done
          echo "[remote-run] stop step done" >> run.log
      - name: Publish to the remote-runs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        run: python3 .github/scripts/publish_run.py "$RUN_DIR" run.log out "${RUN_EXIT:-1}"
      - name: Fail if the command failed
        if: steps.run.outputs.exit != '0'
        run: exit 1
