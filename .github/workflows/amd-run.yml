# Run a command on Chiya's AMD Developer Cloud droplet (MI300X, ROCm) from any branch, or on any
# rented ROCm host reachable over SSH with the AMD_SSH_KEY secret's key (its public half in the
# host's authorized_keys): set host, port and user; torch_rocm installs ROCm PyTorch if the image
# has none.
# The droplet is created by hand in the AMD cloud panel (it bills by the hour while it exists);
# this workflow copies the chosen ref to it over SSH, runs the command, brings back ./out, and can
# destroy the droplet at the end. Results land on the `remote-runs` branch like remote-run.yml.
name: amd-run

on:
  workflow_dispatch:
    inputs:
      name:
        description: Short label for the run (letters, digits, dashes)
        required: true
      host:
        description: Droplet public IPv4, or any SSH host's IPv4 or DNS name
        required: true
      user:
        description: SSH user (root on an AMD droplet; the provider's login user otherwise)
        default: "root"
      torch_rocm:
        description: "If the host's python3 has no ROCm torch: the ROCm wheel index to install torch 2.5.1 from (6.1 or 6.2); empty uses the image's"
        default: ""
      port:
        description: SSH port (22 on an AMD droplet; RunPod's exposed TCP port otherwise)
        default: "22"
      cmd:
        description: Command, starting with `python scripts/` or `python -m preflight.`
        required: true
      ref:
        description: Branch or commit to run
        default: main
      timeout:
        description: Minutes before the command is stopped (max 240)
        default: "60"
      destroy_droplet_id:
        description: If set, destroy this droplet id when done (needs the DO_API_TOKEN secret)
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      RUN_NAME: ${{ github.event.inputs.name }}
      RUN_HOST: ${{ github.event.inputs.host }}
      RUN_USER: ${{ github.event.inputs.user }}
      TORCH_ROCM: ${{ github.event.inputs.torch_rocm }}
      RUN_PORT: ${{ github.event.inputs.port }}
      RUN_CMD: ${{ github.event.inputs.cmd }}
      RUN_REF: ${{ github.event.inputs.ref }}
      RUN_TIMEOUT: ${{ github.event.inputs.timeout }}
      DESTROY_ID: ${{ github.event.inputs.destroy_droplet_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Check the inputs
        run: |
          set -euo pipefail
          [[ "$RUN_NAME" =~ ^[A-Za-z0-9-]{1,48}$ ]] || { echo "bad name"; exit 2; }
          [[ "$RUN_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ || "$RUN_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$ ]] || { echo "host must be an IPv4 address or a DNS name"; exit 2; }
          [[ "$RUN_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "user must be a plain login name"; exit 2; }
          [[ -z "$TORCH_ROCM" || "$TORCH_ROCM" =~ ^6\.[12]$ ]] || { echo "torch_rocm must be empty, 6.1 or 6.2"; exit 2; }
          [[ "$RUN_PORT" =~ ^[0-9]{1,5}$ && "$RUN_PORT" -ge 1 && "$RUN_PORT" -le 65535 ]] || { echo "port must be 1 to 65535"; exit 2; }
          [[ "$RUN_TIMEOUT" =~ ^[0-9]{1,3}$ && "$RUN_TIMEOUT" -ge 1 && "$RUN_TIMEOUT" -le 240 ]] || { echo "bad timeout"; exit 2; }
          [[ "$RUN_CMD" =~ ^python\ (scripts/|-m\ preflight\.)[A-Za-z0-9_./:=,@\ -]*$ ]] || { echo "cmd must start with 'python scripts/' or 'python -m preflight.' and contain no shell operators"; exit 2; }
          [[ -z "$DESTROY_ID" || "$DESTROY_ID" =~ ^[0-9]{1,15}$ ]] || { echo "bad droplet id"; exit 2; }
          echo "RUN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUN_DIR=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}-amd-${RUN_NAME}" >> "$GITHUB_ENV"
      - name: SSH key
        env:
          AMD_SSH_KEY: ${{ secrets.AMD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AMD_SSH_KEY" > ~/.ssh/amd && chmod 600 ~/.ssh/amd
          ssh-keyscan -T 15 -p "$RUN_PORT" "$RUN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy the code and run
        id: run
        run: |
          set +e
          S="ssh -i $HOME/.ssh/amd -p $RUN_PORT -o BatchMode=yes -o ServerAliveInterval=30 $RUN_USER@$RUN_HOST"
          # the checkout lives in the login's home (/root/preflight on a droplet)
          rsync -az --delete -e "ssh -i $HOME/.ssh/amd -p $RUN_PORT -o BatchMode=yes" \
            --exclude .git --exclude node_modules --exclude .venv --exclude .venv-amd --exclude web/dist ./ "$RUN_USER@$RUN_HOST:preflight/" > run.log 2>&1
          # The droplet image ships ROCm PyTorch; reuse it instead of downloading torch again. On a host
          # without one, torch_rocm installs torch 2.5.1 (the probe image's) from that ROCm wheel index
          # into the run's venv.
          # With torch_rocm set, the venv is isolated from the host's own packages: a rented image's newer
          # libraries would otherwise be pinned as install constraints and sink the zoo's requirements
          # (RunPod, Nov 2: datasets==3.1.0 couldn't resolve). Without it, the venv reuses the image's torch.
          if [ -n "$TORCH_ROCM" ]; then
            SITE=""
            TORCH_STEP="(.venv-amd/bin/python -c 'import torch, sys; sys.exit(0 if torch.version.hip else 1)' 2>/dev/null || VIRTUAL_ENV=.venv-amd uv pip install -q torch==2.5.1+rocm$TORCH_ROCM --index-url https://download.pytorch.org/whl/rocm$TORCH_ROCM && VIRTUAL_ENV=.venv-amd uv pip install -q numpy pip)"
          else
            SITE="--system-site-packages"
            TORCH_STEP="true"
          fi
          $S "cd ~/preflight && rm -rf out && mkdir -p out \
            && export PATH=\$HOME/.local/bin:\$PATH \
            && (command -v uv >/dev/null || python3 -m pip install -q --user uv || python3 -m pip install -q --user --break-system-packages uv || python3 -m pip install -q uv) \
            && rm -rf .venv-amd && uv venv -q $SITE --python \$(command -v python3) .venv-amd \
            && $TORCH_STEP \
            && .venv-amd/bin/python -c 'import torch; assert torch.version.hip, \"not a ROCm torch\"; print(\"torch\", torch.__version__, \"hip\", torch.version.hip, torch.cuda.get_device_name(0))' \
            && VIRTUAL_ENV=.venv-amd uv pip install -q -e . psutil \
            && timeout ${RUN_TIMEOUT}m .venv-amd/bin/$RUN_CMD" >> run.log 2>&1
          code=$?
          rsync -az -e "ssh -i $HOME/.ssh/amd -p $RUN_PORT -o BatchMode=yes" "$RUN_USER@$RUN_HOST:preflight/out/" ./out/ >> run.log 2>&1
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -n 50 run.log
          exit 0
      - name: Destroy the droplet
        if: always() && env.DESTROY_ID != ''
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $DO_API_TOKEN" "https://api.digitalocean.com/v2/droplets/$DESTROY_ID" \
            && echo "droplet $DESTROY_ID destroyed" | tee -a run.log \
            || echo "could not destroy droplet $DESTROY_ID: destroy it in the AMD cloud panel now" | tee -a run.log
      - name: Publish to the remote-runs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AMD_SSH_KEY: ${{ secrets.AMD_SSH_KEY }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        run: python3 .github/scripts/publish_run.py "$RUN_DIR" run.log out "${RUN_EXIT:-1}"
      - name: Fail if the command failed
        if: steps.run.outputs.exit != '0'
        run: exit 1
