# Deploys only when started by hand (Actions > deploy > Run workflow): the API's spend ledger is
# an always-on Modal container that bills every hour, so the live app runs only while it is
# needed. The stranger job (web/e2e/stranger.mjs) gates every deploy: web and API go out only when
# a stranger's first minutes work on this exact build. Push and nightly triggers stay off until
# Chiya turns them back on.
# Web -> Cloudflare Pages; API -> Modal. Each half skips itself until its code exists.
# Secrets (per GitHub environment): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, MODAL_TOKEN_ID, MODAL_TOKEN_SECRET.
# Runtime secrets live in Modal ("preflight-meta", "preflight-api") and the Pages project, never here.
# Modal: the API deploys to the Modal environment "main", where A's job store and the records
# volume live (an API deployed elsewhere couldn't see them); its URL carries that environment, so
# the Pages project's PREFLIGHT_API_ORIGIN points there. Only a production deploy touches Modal;
# a preview publishes the web app alone. The API's startup check runs in its real image on CPU
# first, against the job store already deployed, and a failed check stops the deploy. A's
# runner is not deployed from here: A deploys it with the queue drained, and its own startup
# check starts a second job-store container that could claim the live store's state. The API
# stays up until stopped by hand: `modal app stop --env main preflight-api`.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  TARGET: ${{ github.event.inputs.environment || 'production' }}

jobs:
  # The gate: nothing deploys unless a stranger's first minutes work on this exact build.
  stranger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: has
        run: test -f web/package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.web == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - if: steps.has.outputs.web == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - if: steps.has.outputs.web == 'true'
        name: Stranger test on the built app (e2e/stranger.mjs)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run stranger

  web:
    needs: stranger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: has
        run: test -f web/package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.web == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - if: steps.has.outputs.web == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - if: steps.has.outputs.web == 'true'
        id: branch
        run: |
          if [ "$TARGET" = "production" ]; then echo "name=main" >> "$GITHUB_OUTPUT"; else echo "name=preview" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.web == 'true'
        name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        # From web/, so web/functions (the same-site /v1 proxy to Modal) deploys with the app.
        # The Pages project needs PREFLIGHT_API_ORIGIN (the Modal API URL) and PREFLIGHT_EDGE_SECRET
        # (same value as in Modal secret "preflight-api"), set once with `wrangler pages secret put`.
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=preflight --branch=${{ steps.branch.outputs.name }}

  api:
    needs: stranger
    if: (github.event.inputs.environment || 'production') == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # source: guess, image build, a 3-minute startup check and the deploy
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: has
        run: test -f api/app.py && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.api == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.x"
          python-version: "3.11"
      - if: steps.has.outputs.api == 'true'
        run: uv sync --locked --extra modal
      - if: steps.has.outputs.api == 'true'
        name: Check the API's startup, then deploy it to Modal (environment main)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          uv run modal run --env main api/app.py::startup_check
          uv run modal deploy --env main api/app.py
